# Importante: el nombre del archivo debe coincidir con spring.application.name=orden-ms

server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:15434/db_pagatu_orden
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    pe.edu.upeu.orden: DEBUG
    org.springframework.cloud.config: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: orden-ms
    ambiente: dev
    equipo: 1
    estudiante: Cuadros Flores Jhosef Giampiere
